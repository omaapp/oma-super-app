name: oma_super_app
description: Oma Super App - Taxi & Tuk Tuk for Al-Rifai and Iraq
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3
  provider: ^6.1.2

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^6.3.2

  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1

  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_polyline_points: ^2.1.0

  intl: ^0.20.2
  http: ^1.5.0

  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  fluttertoast: ^8.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/branding/
    - assets/onboarding/
    - assets/images/
    - assets/icons/
    - assets/animations/